# Image `base`: Windows from an ISO, installed unattended and debloated, offline.
# `winvm config dump base` prints this file. Copy it to ~/.config/winvm/images/base.yaml
# to change it (that file then replaces this one), or make more images like it.
#
# Every image built from an ISO starts with the values below; its own file only needs
# what differs. An image built on another image instead says `from: NAME` (or a path to
# its file) and lists `steps` - see the README.

iso: null                        # the Windows ISO; null = the newest one in ${data_dir}/iso
                                 # (where `winvm up --iso PATH` links it). Leave it null in
                                 # files you share: everyone links their own ISO once.
edition: Windows 11 Pro          # as listed by `winvm editions`; or `index: N`
hostname: WINSLIM                # max 15 chars
user: user                       # local administrator; SSH logs in with keys
password: winslim                # console / RDP
timezone: W. Europe Standard Time
locale: en-US
keyboard: "0409:00000409"        # input locale "language:layout" (0409:00000409 = US)
disk_size: 64G                   # virtual; qcow2 only stores what is used
slim: false                      # true: keep the debloated image in the cache (~6 GB): rebuilds
                                 # take a fraction of the time (the first build a bit longer)
debloat:
  strip_payloads: true           # drop payloads of disabled features (re-enabling needs media)
  compact_os: false              # CompactOS in the guest; false = raw, qcow2's zstd compresses better
  remove_webview: true           # Edge WebView2 runtime (~1 GB)

# Steps run during the install, as SYSTEM, without network, in a work folder:
#   - run: <PowerShell>                    fails the build on an error / non-zero exit
#   - download: {url: U, sha256: H}        fetched on the host, checked, put in the work folder
#                                          (as `name: F` if given, else the URL's file name)
#   - copy: [HOST_PATH]                    a file or folder into the work folder
setup: []

# How instances of this image run (merged over the machine's `run` defaults; images
# built on this one inherit it): ram (4G, or {min: 2G, max: 8G} for dynamic memory),
# cpus, mounts.
run: {}
